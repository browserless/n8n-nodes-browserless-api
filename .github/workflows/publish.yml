name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Assert bundled npm >= 11.10.0 (min-release-age support)
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && minor >= 10))) process.exit(1)' "$(npm --version)"
      - name: Verify release tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node -e 'const assert = require("node:assert/strict"); const pkg = require("./package.json"); assert.equal(pkg.name, "n8n-nodes-browserless-api"); assert.equal(process.env.TAG, "v" + pkg.version)'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run build
        run: npm run build
      # Dependency and build scripts run without OIDC or the npm publishing token.
      # The existing prepublishOnly hook remains disabled, as before this split.
      - name: Pack npm package
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
          shopt -s nullglob dotglob
          archives=("$RUNNER_TEMP/npm-package/"*)
          [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ] || { echo 'expected exactly one npm archive' >&2; exit 1; }
          mv "${archives[0]}" "$RUNNER_TEMP/npm-package/package.tgz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-package/package.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      # Provenance still needs OIDC; registry authentication remains NPM_TOKEN.
      id-token: write
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          check-latest: true
          package-manager-cache: false
      - name: Assert bundled npm >= 11.10.0 (min-release-age support)
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && minor >= 10))) process.exit(1)' "$(npm --version)"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Verify the prepared package
        env:
          PACKAGE_SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob dotglob
          archives=("$RUNNER_TEMP/npm-package/"*)
          [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ] && [ ! -L "${archives[0]}" ] || { echo 'expected exactly one npm archive' >&2; exit 1; }
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'invalid package checksum' >&2; exit 1; }
          printf '%s  %s\n' "$PACKAGE_SHA256" "${archives[0]}" | sha256sum --check
          # Use npm's parser: tar member names can alias the manifest after extraction.
          npm pack "${archives[0]}" --dry-run --json --ignore-scripts > "$RUNNER_TEMP/manifest.json"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const packages = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/manifest.json`, 'utf8'));
          assert.equal(packages.length, 1);
          const [pkg] = packages;
          assert.equal(pkg.name, 'n8n-nodes-browserless-api');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/);
          assert.equal(process.env.TAG, `v${pkg.version}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `DIST_TAG=${pkg.version.includes('-') ? 'next' : 'latest'}\n`);
          NODE
      # No installs, builds, caches, or lifecycle scripts in this privileged job.
      # Tarball publishing omits gitHead; provenance identifies the source commit.
      - name: Publish with provenance
        shell: bash
        run: |
          archive="$RUNNER_TEMP/npm-package/package.tgz"
          args=()
          if [ "$DIST_TAG" = next ]; then args+=(--tag next); fi
          npm publish "$archive" --provenance --access public --ignore-scripts "${args[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

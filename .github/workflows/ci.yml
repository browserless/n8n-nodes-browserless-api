name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Assert bundled npm >= 11.10.0 (min-release-age support)
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && minor >= 10))) process.exit(1)' "$(npm --version)"

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run tests
        run: 'npm test'

      - name: Run build
        run: 'npm run build'
